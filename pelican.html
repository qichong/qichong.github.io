<!doctype html>
<html lang="zh-CN">
<head>

<title>Pelican on Earth · SVG Motion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07131b;color:#eff7f7;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.stage{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#193c4a 0,#0b202a 38%,#07131b 74%)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px);background-size:92px 92px;opacity:.25;transform:rotate(-7deg) scale(1.2)}.hint{position:absolute;top:28px;left:32px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.62}.title{position:absolute;top:24px;right:32px;text-align:right}.title strong{display:block;font-size:14px;letter-spacing:.18em}.title span{font-size:11px;opacity:.55}.scene{width:min(1100px,96vw);aspect-ratio:1.6/1;position:relative}.scene svg{width:100%;height:100%;overflow:visible}.cloud{fill:none;stroke:#8ac7d3;stroke-width:5;stroke-linecap:round;opacity:.18}.ocean{fill:#1f7184}.land{fill:#9bd17b;stroke:#154f45;stroke-width:3}.ice{fill:#e7f5ef}.grid{fill:none;stroke:#bde9ef;stroke-width:2;opacity:.28}.glow{fill:#56d8e6;opacity:.08}.bike{stroke:#20252a;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.bikeThin{stroke:#68747a;stroke-width:4;fill:none;stroke-linecap:round}.wheel{fill:none;stroke:#dde6e7;stroke-width:7}.spoke{stroke:#718087;stroke-width:2}.pelican-fill{fill:#f1f3ee}.pelican-shade{fill:#cad3cf}.pelican-dark{fill:#4a5557}.beak{fill:#e7a84c}.eye{fill:#151b1c}.leg{stroke:#d79938;stroke-width:7;stroke-linecap:round;fill:none}.foot{stroke:#d79938;stroke-width:6;stroke-linecap:round;fill:none}.speed{stroke:#9cdde4;stroke-width:4;stroke-linecap:round;opacity:.45}.badge{fill:rgba(8,22,28,.72);stroke:rgba(166,228,232,.22);stroke-width:1}.badgeText{fill:#d9f3f3;font-size:14px;letter-spacing:.08em}.controls{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.btn{border:1px solid rgba(190,235,238,.2);background:rgba(8,22,28,.5);backdrop-filter:blur(8px);color:#e8f7f7;border-radius:999px;padding:8px 14px;cursor:pointer}.btn:hover{background:rgba(22,53,62,.8)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}@keyframes pedal{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(50px)}}
.wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}.pelicanMotion{transform-box:fill-box;transform-origin:center bottom;animation:bob .8s ease-in-out infinite}.pedalSpin{transform-box:fill-box;transform-origin:center;animation:pedal 1.1s linear infinite}.clouds{animation:drift 9s ease-in-out infinite alternate}.paused *{animation-play-state:paused!important}
@media(max-width:700px){.hint,.title{top:14px}.hint{left:16px}.title{right:16px}.scene{width:112vw}.controls{bottom:16px}.badgeText{font-size:11px}}
</style></head>
<body><div class="stage" id="stage"><div class="stars"></div><div class="hint">SVG / FRONT-END MOTION</div><div class="title"><strong>PELICAN × EARTH</strong><span>一只鹈鹕的环球骑行</span></div>

</svg></div>
<div class="controls"><button class="btn" id="toggle">暂停动画</button><button class="btn" id="faster">加速</button><button class="btn" id="slower">减速</button></div></div>
<script>const stage=document.getElementById('stage');const toggle=document.getElementById('toggle');let scale=1;function setSpeed(){document.querySelectorAll('*').forEach(e=>{if(e.style.animationDuration){const m=e.dataset.baseDuration||e.style.animationDuration;e.style.animationDuration=(parseFloat(m)/scale)+'s'}})}document.querySelectorAll('*').forEach(e=>{const s=getComputedStyle(e).animationDuration;if(s&&s!=='0s'&&s!=='normal')e.dataset.baseDuration=s});toggle.onclick=()=>{stage.classList.toggle('paused');toggle.textContent=stage.classList.contains('paused')?'继续动画':'暂停动画'};document.getElementById('faster').onclick=()=>{scale=Math.min(2.5,scale+.25);setSpeed()};document.getElementById('slower').onclick=()=>{scale=Math.max(.5,scale-.25);setSpeed()};</script></body></html>
