<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelican × Earth</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07131b;color:#eef8f8;font-family:system-ui,sans-serif}.stage{height:100vh;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#183b48,#07141b 72%)}.stars{position:absolute;inset:0;opacity:.24;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:92px 92px}.scene{width:min(1080px,96vw)}svg{width:100%;height:auto;display:block}.cloud{fill:none;stroke:#8ac7d3;stroke-width:5;stroke-linecap:round;opacity:.16}.earth{fill:#1b6477}.land{fill:#9bd17b;stroke:#204f45;stroke-width:2}.grid{fill:none;stroke:#c8eef2;stroke-width:2;opacity:.2}.ice{fill:#e7f5ef}.bike{stroke:#20262b;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.wheel{fill:none;stroke:#eef5f5;stroke-width:7}.spoke{stroke:#718087;stroke-width:2}.pelican{fill:#f2f4ef}.shade{fill:#cad3cf}.dark{fill:#4d585a}.beak{fill:#e6aa51}.eye{fill:#111718}.leg{stroke:#d99a39;stroke-width:7;fill:none;stroke-linecap:round}.speed{stroke:#9bdde5;stroke-width:4;stroke-linecap:round;opacity:.4}@keyframes map{from{transform:translateX(0)}to{transform:translateX(-380px)}}@keyframes wheels{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}#map{animation:map 8s linear infinite}.w{transform-box:fill-box;transform-origin:center;animation:wheels .9s linear infinite}.p{transform-box:fill-box;transform-origin:center bottom;animation:bob .8s ease-in-out infinite}.paused *{animation-play-state:paused!important}.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.btn{padding:9px 15px;border-radius:99px;border:1px solid #31515b;background:#0a232cbb;color:#eaf8f8;cursor:pointer}</style></head><body><div class="stage" id="stage"><div class="stars"></div><div class="scene"><svg viewBox="0 0 1000 620" aria-label="鹈鹕在滚动的地球上骑自行车"><defs><clipPath id="clip"><circle cx="500" cy="385" r="185"/></clipPath><radialGradient id="o" cx="35%" cy="25%"><stop offset="0" stop-color="#48bad1"/><stop offset="1" stop-color="#164a5b"/></radialGradient></defs><path class="cloud" d="M120 170c36-24 75 6 57 28 42-10 78 18 47 38-40 25-88-2-118 14-35 19-76-8-56-31 14-16 40-16 70-13"/><circle cx="500" cy="385" r="185" fill="url(#o)"/><g clip-path="url(#clip)"><path class="grid" d="M315 385h370M325 330h350M325 440h350M500 200v370M440 205c-45 65-45 295 0 360M560 205c45 65 45 295 0 360"/><g id="map"><g transform="translate(-40)"><path class="land" d="M333 331l35-29 49-18 31 18 3 28-24 22-19 3-16 27-39 9-24-23z"/><path class="land" d="M476 250l39 8 17 24-10 21-20 4-13 28-20-6-13-33z"/><path class="land" d="M565 286l51-11 44 26 10 33-22 20-37-4-18-18-31 9-17-25z"/><path class="land" d="M602 366l48 15 25 28-14 27-30 7-18-23-35-9z"/><path class="land" d="M468 402l25 7 12 31-10 43-24 22-14-24 6-35-14-25z"/><path class="ice" d="M356 224h285l-12 27-38-12-39 7-39-11-47 14-56-12z"/><path class="ice" d="M351 520l55 12 47-14 36 11 49-11 56 15-20 33H363z"/></g><g transform="translate(320)"><path class="land" d="M333 331l35-29 49-18 31 18 3 28-24 22-19 3-16 27-39 9-24-23z"/><path class="land" d="M476 250l39 8 17 24-10 21-20 4-13 28-20-6-13-33z"/><path class="land" d="M565 286l51-11 44 26 10 33-22 20-37-4-18-18-31 9-17-25z"/></g></g></g><circle cx="500" cy="385" r="185" fill="none" stroke="#8bdce7" stroke-width="3" opacity=".35"/>
<!-- Bike is completely separate from the map animation. --> <g transform="translate(0,-5)"><g class="bike"><g class="w"><circle class="wheel" cx="415" cy="368" r="64"/><g class="spoke"><path d="M415 304v128M351 368h128M370 323l90 90M370 413l90-90"/></g></g><g class="w"><circle class="wheel" cx="612" cy="368" r="64"/><g class="spoke"><path d="M612 304v128M548 368h128M567 323l90 90M567 413l90-90"/></g></g><path d="M415 368l73-61 70 61h54M488 307l124 61M488 307l-23-62M488 307l-45 61M465 245h47"/></g><g class="w"><circle cx="488" cy="307" r="14" stroke="#20262b" stroke-width="6" fill="#d0a04a"/></g><g class="p"><ellipse class="pelican" cx="506" cy="211" rx="62" ry="46"/><path class="shade" d="M455 207c22-36 80-51 114-19-17 29-48 43-91 42z"/><path class="pelican" d="M486 177c-19-33-8-59 22-68 29-8 52 11 54 36 2 20-14 32-34 40z"/><path class="beak" d="M539 151c55 0 92 12 104 30-24 21-71 22-101 10z"/><circle class="eye" cx="547" cy="142" r="5"/><path class="dark" d="M458 202c-25 12-35 31-31 55 28 18 54 8 68-17z"/><path class="pelican" d="M514 214c-20 11-35 32-35 54 19 12 41 6 57-15z"/><path class="leg" d="M493 259l-5 39M525 259l8 39M488 298l-17 9M488 298l15 6M533 298l-15 8M533 298l17 2"/></g><path class="speed" d="M324 319h-62M336 340h-82M314 361h-47"/></g></svg></div><div class="controls"><button class="btn" id="toggle">暂停</button><button class="btn" id="fast">加速</button><button class="btn" id="slow">减速</button></div></div><script>const stage=document.getElementById('stage'),map=document.getElementById('map'),wheels=document.querySelectorAll('.w'),toggle=document.getElementById('toggle');let s=1;function tune(){map.style.animationDuration=8/s+'s';wheels.forEach(w=>w.style.animationDuration=.9/s+'s')}toggle.onclick=()=>{stage.classList.toggle('paused');toggle.textContent=stage.classList.contains('paused')?'继续':'暂停'};fast.onclick=()=>{s=Math.min(3,s+.25);tune()};slow.onclick=()=>{s=Math.max(.5,s-.25);tune()};</script></body></html>
