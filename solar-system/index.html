<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <title>SOLAR / 3D 太阳系探索</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="stars"></div>
  <header>
    <div class="brand">SOLAR <i>/</i> 3D <small>SOLAR SYSTEM EXPLORER</small></div>
    <div class="hint">拖动旋转 · 滚轮缩放 · 点击星球查看详情</div>
  </header>

  <aside class="left panel">
    <div class="eyebrow">PLANET <span id="planetNo">00</span></div>
    <div class="latin" id="latin">SOL</div>
    <h1 id="name">太阳</h1>
    <p id="tagline">太阳系的中心恒星</p>
    <div class="facts" id="facts"></div>
    <p class="desc" id="desc"></p>
    <div class="controls">
      <button id="pauseBtn">Ⅱ 暂停运动</button>
      <button id="focusBtn">◎ 聚焦当前</button>
    </div>
  </aside>

  <aside class="right panel">
    <div class="eyebrow">ORBIT / MOTION</div>
    <div class="motion-row"><span>公转速度</span><strong id="speedValue">1.0×</strong></div>
    <input id="speed" type="range" min="0" max="5" step="0.1" value="1">
    <div class="legend"><span class="legend-dot"></span>轨道</div>
    <div class="planet-list" id="planetList"></div>
  </aside>

  <footer>
    <div class="tip">REAL-TIME 3D · 自转 + 公转 · 轨道可视化</div>
    <div id="status">正在初始化太阳系…</div>
  </footer>

  <script type="module" src="./main.js?v=20260830-1"></script>
</body>
</html>
