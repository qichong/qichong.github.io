<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican × Rolling Earth</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06141c;color:#effafa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.stage{width:100%;height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 38%,#204957 0,#0d2731 40%,#06141c 78%)}.stars{position:absolute;inset:0;opacity:.25;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:100px 100px}.top{position:absolute;top:25px;left:30px;font-size:11px;letter-spacing:.24em;opacity:.55}.title{position:absolute;top:22px;right:30px;text-align:right}.title b{display:block;font-size:14px;letter-spacing:.16em}.title span{font-size:11px;opacity:.5}.scene{width:min(1120px,96vw)}svg{display:block;width:100%;height:auto}.cloud{fill:none;stroke:#98d5dc;stroke-width:5;stroke-linecap:round;opacity:.18}.grid{fill:none;stroke:#c5eef1;stroke-width:2;opacity:.22}.land{fill:#9bd078;stroke:#205547;stroke-width:3}.ice{fill:#edf6f1}.earthEdge{fill:none;stroke:#8be0e7;stroke-width:3;opacity:.35}.frame{fill:none;stroke:#20272a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.rim{fill:none;stroke:#eef7f5;stroke-width:7}.spoke{stroke:#738289;stroke-width:2}.thin{fill:none;stroke:#69777e;stroke-width:4;stroke-linecap:round}.body{fill:#f0f3ef}.shade{fill:#cbd4d0}.dark{fill:#4b5759}.beak{fill:#e7a84e}.eye{fill:#111819}.leg{fill:none;stroke:#d89b40;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.speed{fill:none;stroke:#9cdde5;stroke-width:4;stroke-linecap:round;opacity:.4}.label{fill:rgba(8,23,29,.7);stroke:rgba(170,231,235,.2)}.labelText{fill:#d8f3f4;font-size:13px;letter-spacing:.08em}.map{animation:mapMove 10s linear infinite}.wheel{transform-box:fill-box;transform-origin:center;animation:wheelMove .75s linear infinite}.pedal{transform-box:fill-box;transform-origin:center;animation:wheelMove .75s linear infinite}.bird{transform-box:fill-box;transform-origin:center bottom;animation:bob .75s ease-in-out infinite}.clouds{animation:cloudMove 10s ease-in-out infinite alternate}.paused *{animation-play-state:paused!important}@keyframes mapMove{from{transform:translateX(0)}to{transform:translateX(-250px)}}@keyframes wheelMove{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes cloudMove{from{transform:translateX(-30px)}to{transform:translateX(40px)}}.ui{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.btn{border:1px solid #31515c;background:#0b252e;color:#edf8f8;border-radius:999px;padding:9px 15px;cursor:pointer}.btn:hover{background:#12343e}@media(max-width:700px){.scene{width:118vw}.top{top:14px;left:14px}.title{top:12px;right:14px}.ui{bottom:12px}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="stars"></div><div class="top">SVG MOTION STUDY</div><div class="title"><b>PELICAN × EARTH</b><span>地球自转 · 自行车独立运转 · 真实踩踏</span></div>
<div class="scene"><svg viewBox="0 0 1000 650" aria-label="鹈鹕在滚动的地球上骑自行车">
<defs><clipPath id="earthClip"><circle cx="500" cy="405" r="190"/></clipPath><radialGradient id="sea" cx="35%" cy="22%"><stop offset="0" stop-color="#4fc0d2"/><stop offset="1" stop-color="#154b5d"/></radialGradient></defs>
<path class="cloud" d="M115 190c32-23 69 4 55 27 38-11 75 11 51 32-29 24-69 1-96 16-35 18-72-8-52-30 13-15 27-18 42-16"/><path class="cloud" d="M770 172c29-19 62 2 51 23 34-7 65 14 45 31-27 21-65 0-91 13-31 15-61-9-45-28 12-13 25-13 40-10"/>
<circle cx="500" cy="405" r="190" fill="url(#sea)"/>
<g clip-path="url(#earthClip)"><path class="grid" d="M310 405h380M320 350h360M320 460h360M500 215v380M445 220c-43 70-43 300 0 370M555 220c43 70 43 300 0 370"/>
<g class="map"><g transform="translate(0)"><path class="land" d="M326 337l52-34 61-12 26 24-14 37-28 6-18 25-43 10-30-18z"/><path class="land" d="M475 260l46-6 27 26-13 28-24 5-12 30-21-8-12-34z"/><path class="land" d="M560 306l58-17 46 30 8 36-27 20-42-7-23-23-31 9-15-24z"/><path class="land" d="M607 390l49 12 22 28-14 28-30 5-19-23-35-9z"/><path class="land" d="M472 424l29 8 9 39-13 45-28 18-15-28 8-36-17-24z"/><path class="ice" d="M345 222h310l-16 29-43-11-48 7-42-12-51 13-49-11z"/><path class="ice" d="M346 548h310l-22 34H370z"/></g><g transform="translate(250)"><path class="land" d="M326 337l52-34 61-12 26 24-14 37-28 6-18 25-43 10-30-18z"/><path class="land" d="M475 260l46-6 27 26-13 28-24 5-12 30-21-8-12-34z"/><path class="land" d="M560 306l58-17 46 30 8 36-27 20-42-7-23-23-31 9-15-24z"/><path class="land" d="M607 390l49 12 22 28-14 28-30 5-19-23-35-9z"/><path class="ice" d="M345 222h310l-16 29-43-11-48 7-42-12-51 13-49-11z"/></g></g></g>
<circle class="earthEdge" cx="500" cy="405" r="190"/>
<!-- 自行车：不属于地球 map 图层，完全独立 -->
<g id="bike">
<g class="wheel" id="wheelLeft"><circle class="rim" cx="405" cy="404" r="68"/><g class="spoke"><path d="M405 336v136M337 404h136M357 356l96 96M357 452l96-96"/></g></g>
<g class="wheel" id="wheelRight"><circle class="rim" cx="620" cy="404" r="68"/><g class="spoke"><path d="M620 336v136M552 404h136M572 356l96 96M572 452l96-96"/></g></g>
<g class="frame"><path d="M405 404l80-70 70 70h65M485 334l135 70M485 334l-24-75M485 334l-50 70M461 259h50"/></g>
<g class="pedal" id="crank"><circle cx="485" cy="334" r="14" fill="#d0a04a" stroke="#20272a" stroke-width="6"/><path class="thin" d="M485 334l31 20"/></g>
<!-- 腿：完全由 JS 按曲柄角度计算，左右腿相位相反 -->
<g class="bird" id="bird">
<ellipse class="body" cx="505" cy="222" rx="64" ry="49"/><path class="shade" d="M453 216c23-39 85-52 117-19-18 31-52 45-95 41z"/><path class="body" d="M486 185c-19-34-8-61 23-70 30-9 53 12 53 37 0 19-17 31-38 40z"/><path class="beak" d="M540 158c54-1 92 12 104 29-23 22-71 24-101 11z"/><circle class="eye" cx="548" cy="149" r="5"/><path class="dark" d="M458 210c-25 14-35 32-31 57 28 18 57 7 69-16z"/><path class="body" d="M514 222c-20 11-36 33-36 55 21 12 43 4 57-17z"/>
<path class="leg" id="legL"/><path class="leg" id="legR"/>
</g>
<path class="speed" d="M318 346h-65M333 370h-82M307 394h-48"/>
</g>
<g transform="translate(700 548)"><rect class="label" width="245" height="44" rx="22"/><text class="labelText" x="18" y="28">EARTH ROLL  •  PEDAL SYNC</text></g>
</svg></div>
<div class="ui"><button class="btn" id="pause">暂停</button><button class="btn" id="fast">加速</button><button class="btn" id="reset">正常速度</button></div></div>
<script>
const stage=document.getElementById('stage');const pause=document.getElementById('pause');const speedBtn=document.getElementById('fast');const reset=document.getElementById('reset');const earth=document.querySelector('.map');const bikeWheels=document.querySelectorAll('#wheelLeft,#wheelRight,#crank');const legL=document.getElementById('legL');const legR=document.getElementById('legR');let rate=1;let pedalAngle=0;let last=performance.now();let paused=false;
function applySpeed(){earth.style.animationDuration=(10/rate)+'s';bikeWheels.forEach(el=>el.style.animationDuration=(.75/rate)+'s')}
function legPath(hipX,hipY,phase){const kneeX=hipX+Math.cos(phase)*24;const kneeY=hipY+Math.sin(phase)*24+15;const footX=485+Math.cos(phase)*30;const footY=334+Math.sin(phase)*20;return `M ${hipX} ${hipY} L ${kneeX.toFixed(1)} ${kneeY.toFixed(1)} L ${footX.toFixed(1)} ${footY.toFixed(1)}`}
function animate(now){const dt=Math.min(40,now-last);last=now;if(!paused){pedalAngle+=(dt*0.0075*rate);legL.setAttribute('d',legPath(494,268,pedalAngle));legR.setAttribute('d',legPath(526,268,pedalAngle+Math.PI))}requestAnimationFrame(animate)}
requestAnimationFrame(animate);applySpeed();pause.onclick=()=>{paused=!paused;stage.classList.toggle('paused',paused);pause.textContent=paused?'继续':'暂停'};speedBtn.onclick=()=>{rate=Math.min(3,rate+.25);applySpeed()};reset.onclick=()=>{rate=1;applySpeed()};
</script></body></html>
