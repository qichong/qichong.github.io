name: Cache Google Tiger GLB

on:
  push:
    paths:
      - '.github/workflows/cache-tiger-glb.yml'
      - 'animal-3d/main-lite.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-tiger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Google Tiger GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p animal-3d/models
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/ar-answers-in-search-models/static/Tiger/model.glb' \
            -o animal-3d/models/tiger.glb
          test -s animal-3d/models/tiger.glb
          size=$(stat -c%s animal-3d/models/tiger.glb)
          echo "Downloaded ${size} bytes"
          if [ "$size" -gt $((18 * 1024 * 1024)) ]; then
            echo 'Tiger GLB exceeds the 18 MB web limit.'
            exit 1
          fi

      - name: Commit model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add animal-3d/models/tiger.glb
          if git diff --cached --quiet; then
            echo 'Tiger model is already cached.'
            exit 0
          fi
          git commit -m 'chore(animal-3d): cache Google Tiger GLB'
          git push
