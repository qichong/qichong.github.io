name: Sync Animal 3D Assets

on:
  push:
    branches: [master]
    paths:
      - 'animal-3d/animal-manifest-realistic.js'
      - '.github/workflows/animal-3d-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animal-3d-assets
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[animal-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify catalog
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CATALOG_VERSION: 3' animal-3d/animal-manifest-realistic.js

      - name: Download verified animal models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p animal-3d/models
          download() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" -o "animal-3d/models/$out"
            test -s "animal-3d/models/$out"
            test "$(head -c 4 "animal-3d/models/$out")" = "glTF"
          }

          test -s animal-3d/models/tiger.glb
          find animal-3d/models -maxdepth 1 -type f -name '*.glb' ! -name 'tiger.glb' -delete

          download 'https://raw.githubusercontent.com/code4fukui/vr-cats/main/lion.glb' 'lion.glb'
          download 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb' 'fox.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/shark.glb' 'shark.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/blue_whale_-_textured.glb' 'whale.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/flying_seagull.glb' 'seagull.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/scarlet_macaw.glb' 'macaw.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/asteroid_starfish_or_seastar.glb' 'starfish.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/tuna.glb' 'tuna.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/swordfish.glb' 'swordfish.glb'

      - name: Write attribution metadata
        shell: bash
        run: |
          cat > animal-3d/models/ATTRIBUTIONS.md <<'EOF'
          # Animal 3D model sources

          ## Existing project models
          - `lion.glb`: https://github.com/code4fukui/vr-cats — CC BY-NC-SA 4.0.
          - `tiger.glb`: existing project asset retained as-is.

          ## Fixed-source models
          - `fox.glb`: KhronosGroup/glTF-Sample-Assets Fox. PixelMannen model CC0 1.0; tomkranis rigging/animation CC BY 4.0; AsoboStudio/scurest conversion CC BY 4.0. Animations: Survey / Walk / Run.
          - `shark.glb`: Open Water source model by Optic_idealist — CC BY 4.0.
          - `whale.glb`: Open Water source model by Bohdan Lvov — CC BY 4.0.
          - `seagull.glb`: Open Water source model by The lighthouse keeper / geminga — CC BY-SA 4.0.
          - `macaw.glb`: Open Water source model by Mateus Schwaab — CC BY 4.0.
          - `starfish.glb`: Open Water source model by Digital Atlas of Ancient Life — CC0 1.0.
          - `tuna.glb`: Open Water source model by Quaternius — CC0 1.0.
          - `swordfish.glb`: Open Water source model by Quaternius — CC0 1.0.

          Open Water license details: https://github.com/bob6664569/open-water/blob/main/THIRD_PARTY_NOTICES.md
          Khronos Fox source: https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox
          EOF

      - name: Commit and push without clobbering concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A animal-3d/models
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'animal-3d: sync verified realistic local models [animal-assets]'

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done

          exit 1
