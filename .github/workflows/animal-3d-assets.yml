name: Download Animal 3D Assets

on:
  push:
    branches: [master]
    paths:
      - 'animal-3d/**'
      - '.github/workflows/animal-3d-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-animal-models:
    if: ${{ !contains(github.event.head_commit.message, '[animal-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace low-poly models with realistic animal GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p animal-3d/models .animal-backup

          # Keep the existing Tiger while replacing the old low-poly set.
          if [ -f animal-3d/models/tiger.glb ]; then
            cp animal-3d/models/tiger.glb .animal-backup/tiger.glb
          fi
          find animal-3d/models -maxdepth 1 -type f -name '*.glb' -delete

          download() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 240 "$url" -o "animal-3d/models/$out"
            test -s "animal-3d/models/$out"
            test "$(head -c 4 "animal-3d/models/$out")" = "glTF"
          }

          # Stable public realistic assets from the open-water project.
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/blue_whale_-_textured.glb' 'whale.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/flying_seagull.glb' 'seagull.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/scarlet_macaw.glb' 'macaw.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/shark.glb' 'shark.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/swordfish.glb' 'swordfish.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/fish/tuna.glb' 'tuna.glb'
          download 'https://raw.githubusercontent.com/bob6664569/open-water/main/site/assets/animals/asteroid_starfish_or_seastar.glb' 'starfish.glb'

          # Official Khronos animated Fox sample.
          download 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb' 'fox.glb'

          # Verified public Sloyd realistic / realistic-leaning GLB endpoints.
          download 'https://storage.googleapis.com/ai-services-quality/jobs/or9arjbu.glb' 'elephant.glb'
          download 'https://storage.googleapis.com/ai-services-quality/jobs/cprtjpcd.glb' 'wolf.glb'
          download 'https://storage.googleapis.com/ai-services-quality/jobs/pqw5ic98.glb' 'lynx.glb'
          download 'https://storage.googleapis.com/ai-services-quality/jobs/vsqb4ncm.glb' 'eagle.glb'

          # Restore the user's original Tiger.
          cp .animal-backup/tiger.glb animal-3d/models/tiger.glb
          download 'https://raw.githubusercontent.com/code4fukui/vr-cats/main/lion.glb' 'lion.glb'

          # Discover strong natural-animal candidates for the remaining slots from
          # Sloyd's public CC BY 4.0 animal catalog. Models with fantasy/cartoon
          # signals are explicitly rejected.
          python3 <<'PY'
          import html
          import re
          import urllib.request
          from pathlib import Path

          OUT = Path('animal-3d/models')
          BASE = 'https://www.sloyd.ai'
          pages = [
              '/free-3d-models/tag/quadruped',
              '/free-3d-models/animals-creatures/birds',
              '/free-3d-models/animals-creatures/sea-life',
              '/free-3d-models/animals-creatures/reptiles',
          ]
          bad = re.compile(r'\b(spectral|ghost|alien|monster|demon|zombie|robot|cute|cartoon|stylized|low-poly|toy|statue|skull|fantasy|wyrm|dragon|wizard|druid)\b', re.I)
          good = re.compile(r'\b(realistic|anatomically|detailed|photoreal|natural|wildlife)\b', re.I)
          targets = {
              'bear': ['bear'], 'deer': ['deer', 'doe', 'stag'], 'horse': ['horse'],
              'giraffe': ['giraffe'], 'zebra': ['zebra'], 'rhino': ['rhino', 'rhinoceros'],
              'hippo': ['hippo', 'hippopotamus'], 'moose': ['moose'], 'boar': ['boar', 'warthog'],
              'owl': ['owl'], 'seal': ['seal'], 'crocodile': ['crocodile', 'alligator'],
              'rabbit': ['rabbit', 'hare'],
          }
          target_score = {'bear':10,'deer':8,'horse':8,'giraffe':8,'zebra':8,'rhino':7,'hippo':6,'moose':7,'boar':5,'owl':5,'seal':4,'crocodile':3,'rabbit':2}

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'ignore')

          candidates = []
          for page in pages:
              try:
                  source = get(BASE + page)
              except Exception as exc:
                  print('WARN', page, exc)
                  continue
              for href, raw in re.findall(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', source, re.I | re.S):
                  title = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', raw))).strip()
                  if not title or bad.search(title):
                      continue
                  match = re.search(r'/free-3d-models/[^"?#]*?([a-z0-9]{8})/?$', href, re.I)
                  if not match:
                      continue
                  job = match.group(1).lower()
                  page_url = href if href.startswith('http') else BASE + href
                  creator = title.rsplit(' by ', 1)[1].strip() if ' by ' in title else 'Sloyd creator'
                  for key, words in targets.items():
                      if any(re.search(r'\b' + re.escape(word) + r'\b', title, re.I) for word in words):
                          score = target_score[key]
                          if good.search(title): score += 100
                          score += max(0, 20 - len(title) // 10)
                          candidates.append((score, key, title, creator, page_url, job))

          chosen = {}
          for row in sorted(candidates, key=lambda x: (-x[0], x[2])):
              if row[1] not in chosen:
                  chosen[row[1]] = row

          required = list(targets)
          missing = [x for x in required if x not in chosen]
          if missing:
              raise SystemExit('No public realistic candidate found for: ' + ', '.join(missing))

          attr = ['# Realistic animal model sources', '',
                  'The previous low-poly Gobkit set has been replaced with realistic / realistic-leaning assets.', '',
                  'Sloyd models: CC BY 4.0. Creator names and source pages are recorded below.',
                  'Open Water sources: license information is recorded from the upstream project.',
                  'Khronos Fox: see the official glTF Sample Assets README for its CC0 / CC BY 4.0 credits.', '',
                  '## Sloyd models']
          for key, title, creator, page_url, job in [chosen[k] for k in required]:
              url = f'https://storage.googleapis.com/ai-services-quality/jobs/{job}.glb'
              out = OUT / f'{key}.glb'
              print('Downloading', key, title, url)
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=180) as r, out.open('wb') as f:
                  f.write(r.read())
              data = out.read_bytes()
              if len(data) < 32 or data[:4] != b'glTF':
                  raise SystemExit(f'Invalid GLB for {key}')
              attr.append(f'- **{key}** — {title} — {creator} — {page_url} — CC BY 4.0')

          attr += ['', '## Fixed-source models',
              '- lion — code4fukui/vr-cats — CC BY-NC-SA 4.0 (retain original notice)',
              '- tiger — existing project model',
              '- elephant — Sloyd public model `or9arjbu` — CC BY 4.0',
              '- wolf — Sloyd White Wolf `cprtjpcd` — CC BY 4.0',
              '- lynx — Sloyd Lynx `pqw5ic98` — CC BY 4.0',
              '- eagle — Sloyd Giant Eagle `vsqb4ncm` — CC BY 4.0',
              '- fox — Khronos glTF Sample Assets Fox',
              '- whale — open-water blue whale textured — CC BY 4.0',
              '- seagull — open-water flying seagull — CC BY-SA 4.0',
              '- macaw — open-water scarlet macaw — CC BY 4.0',
              '- shark — open-water shark — CC BY 4.0',
              '- swordfish — open-water swordfish — CC0 1.0',
              '- tuna — open-water tuna — CC0 1.0',
              '- starfish — open-water asteroid starfish / sea star — CC0 1.0']
          (OUT / 'ATTRIBUTIONS.md').write_text('\n'.join(attr) + '\n', encoding='utf-8')
          PY

      - name: Commit realistic animal assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .animal-backup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A animal-3d/models
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'animal-3d: replace low-poly animals with realistic GLBs [animal-assets]'
          git push
